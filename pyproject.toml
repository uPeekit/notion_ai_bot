[project]
name = "notion-ai-bot"
version = "0.0.1"
description = "Local Telegram → Notion assistant"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot~=22.8",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "faster-whisper>=1.2",
    "pyyaml>=6.0",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs real Ollama/Notion"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
